output:
  - execution
  - execution_out
  - execution_info
  - summary

pre-commit:
  parallel: true
  commands:
    frontend-format:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: task frontend:format

    frontend-lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: task frontend:lint

    backend-format:
      glob: "*.py"
      run: task backend:format

    backend-lint:
      glob: "*.py"
      run: task backend:lint

pre-push:
  commands:
    all-checks:
      run: task pre-push

commit-msg:
  commands:
    message-check:
      run: |
        if ! grep -qE "^(feat|fix|refactor|chore): " {1}; then
          echo "🔥 Commit message must start with: feat|fix|refactor|chore"
          exit 1
        fi
