version: "3.8"

# Common volumes for git operations (reusable definition)
x-git-volumes: &git-volumes
  - ~/.ssh/id_rsa:/root/.ssh/id_rsa:ro
  - ~/.gitconfig:/root/.gitconfig:ro

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thor-workspace
    volumes:
      - .:/workspace
      - ~/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /workspace
    command: sleep infinity
    networks:
      - thor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thor-backend
    volumes:
      - ./backend:/workspace/backend
      - backend-venv:/workspace/backend/.venv
    working_dir: /workspace/backend
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT}
      - FRONTEND_ENDPOINT=${FRONTEND_ENDPOINT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    command: sleep infinity
    networks:
      - thor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thor-frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    working_dir: /workspace/frontend
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=2048
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    command: sleep infinity
    networks:
      - thor-network

      # tunnel:
      #   image: cloudflare/cloudflared:latest
      #   restart: always
      #   command: tunnel --no-autoupdate run --url http://frontend:5173
      #   networks:
      # - thor-network

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - thor-network

volumes:
  backend-venv:
  frontend-node-modules:

networks:
  thor-network:
    driver: bridge
